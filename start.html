<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Obsidian Browser</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#1a1a2e;color:#eee;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:20px}
h1{font-size:48px;color:#e94560;margin-bottom:8px}
p{color:#888;font-size:14px;margin-bottom:30px}
.search-box{display:flex;gap:8px;width:600px;max-width:90%}
.search-box input{flex:1;padding:14px 18px;border:1px solid #0f3460;border-radius:10px;background:#16213e;color:#eee;font-size:15px;outline:none}
.search-box input:focus{border-color:#e94560}
.search-box button{padding:14px 28px;background:#e94560;color:#fff;border:none;border-radius:10px;font-size:15px;cursor:pointer}
.shortcuts{display:flex;gap:16px;margin-top:40px;flex-wrap:wrap;justify-content:center}
.shortcut{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 24px;background:#16213e;border-radius:12px;border:1px solid #0f3460;cursor:pointer;text-decoration:none;color:#aaa;font-size:12px;transition:all 0.2s}
.shortcut:hover{background:#0f3460;color:#fff;border-color:#e94560}
.shortcut .icon{font-size:28px}
.footer{position:fixed;bottom:12px;color:#444;font-size:11px}
</style>
</head>
<body>
<h1>Obsidian</h1>
<p>Stealth browser · Web scraper · AI-ready</p>
<div class="search-box">
  <input id="q" type="text" placeholder="Search or enter URL..." autofocus>
  <button id="go">Go</button>
</div>
<div class="shortcuts">
  <a class="shortcut" href="https://www.google.com"><span class="icon">🔍</span>Google</a>
  <a class="shortcut" href="https://www.github.com"><span class="icon">🐙</span>GitHub</a>
  <a class="shortcut" href="https://www.reddit.com"><span class="icon">💬</span>Reddit</a>
  <a class="shortcut" href="https://en.wikipedia.org"><span class="icon">📚</span>Wikipedia</a>
</div>
<div class="footer">Obsidian Browser v0.2.0</div>
<script>
function go(){
  var q = document.getElementById('q').value.trim();
  if(!q) return;
  if(q.includes('.') || q.startsWith('http')) {
    window.location.href = q.startsWith('http') ? q : 'https://'+q;
  } else {
    window.location.href = 'https://www.google.com/search?q='+encodeURIComponent(q);
  }
}
document.getElementById('go').onclick = go;
document.getElementById('q').addEventListener('keydown', function(e){if(e.key==='Enter') go();});
</script>
</body>
</html>
